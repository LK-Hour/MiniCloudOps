# MiniOps CI/CD (docs/MiniCloudOps.md §10)
#   1. Source validation   2. Automated tests (unit, then integration on the full stack)
#   3. Docker build        4. Publish to GHCR
# Stage 5 (local run) is `make deploy` on the demo machine.
name: CI/CD

on:
  push:
    branches: [main, develop]
    tags: ["v*"]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    name: Source validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Lint Python (ruff)
        run: pip install ruff==0.8.0 && ruff check services tests
      - name: Validate docker-compose.yml
        run: cp .env.example .env && docker compose config -q

  test-services:
    name: Test ${{ matrix.service }}
    needs: validate
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [target-service, monitoring-service, incident-service, notification-service]
    defaults:
      run:
        working-directory: services/${{ matrix.service }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/${{ matrix.service }}/requirements*.txt
      - run: pip install -r requirements-dev.txt
      - run: pytest -q

  test-frontend:
    name: Build frontend
    needs: validate
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build

  integration:
    name: Integration tests (full stack)
    needs: test-services
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Start the stack with the sandbox app
        run: |
          cp .env.example .env
          docker compose --profile demo up -d --build --wait --wait-timeout 300 \
            gateway target-service monitoring-service incident-service notification-service demo-app loki alloy
      - run: pip install -r tests/requirements.txt
      - run: python -m pytest -v tests/integration
      - name: Service logs (on failure)
        if: failure()
        run: docker compose --profile demo logs --no-color --tail 200
      - name: Stop the stack
        if: always()
        run: docker compose --profile demo down -v

  build-and-publish:
    name: Image ${{ matrix.name }}
    needs: [test-services, test-frontend, integration]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: target-service, context: services/target-service }
          - { name: monitoring-service, context: services/monitoring-service }
          - { name: incident-service, context: services/incident-service }
          - { name: notification-service, context: services/notification-service }
          - { name: frontend, context: frontend }
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/miniops-${{ matrix.name }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=branch
            type=sha,prefix=sha-
            type=semver,pattern={{version}}

      # Pull requests only build (validation); pushes also publish.
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: GIT_SHA=${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
