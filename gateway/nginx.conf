# MiniOps API gateway: single public entry point for the backend services.
# Services are resolved at request time, so the gateway stays up if one service is down.

map $http_x_correlation_id $correlation_id {
    default $http_x_correlation_id;
    ""      "req-$request_id";
}

server {
    listen 80;
    resolver 127.0.0.11 valid=10s ipv6=off;   # Docker's embedded DNS

    client_max_body_size 1m;
    proxy_connect_timeout 3s;
    proxy_read_timeout 10s;

    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Correlation-ID $correlation_id;
    # Services echo the header too; hide theirs so the response carries exactly one.
    proxy_hide_header X-Correlation-ID;
    add_header X-Correlation-ID $correlation_id always;

    # A backend that is down or times out gets the standard error body instead of nginx's HTML page.
    error_page 502 503 504 = @service_unavailable;
    location @service_unavailable {
        default_type application/json;
        return 503 '{"error":{"code":503,"message":"Service unavailable","details":null,"correlation_id":"$correlation_id"}}';
    }

    location = /health {
        default_type application/json;
        return 200 '{"status":"ok","service":"gateway"}';
    }

    # Internal only: the Monitoring Service reports status straight to target-service.
    # Regex locations win over prefix locations, so this is checked before /api/v1/targets.
    location ~ ^/api/v1/targets/[^/]+/status/?$ {
        default_type application/json;
        return 404 '{"error":{"code":404,"message":"Unknown route","details":null,"correlation_id":"$correlation_id"}}';
    }

    location /api/v1/targets {
        set $upstream http://target-service:8000;
        proxy_pass $upstream;
    }

    location /api/v1/monitoring {
        set $upstream http://monitoring-service:8000;
        proxy_pass $upstream;
    }

    location /api/v1/incidents {
        set $upstream http://incident-service:8000;
        proxy_pass $upstream;
    }

    # Read access for the dashboard's notification panel.
    location /api/v1/notifications {
        set $upstream http://notification-service:8000;
        proxy_pass $upstream;
    }

    location / {
        default_type application/json;
        return 404 '{"error":{"code":404,"message":"Unknown route","details":null,"correlation_id":"$correlation_id"}}';
    }
}
