<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 880" width="1280" height="880" font-family="'Public Sans', 'Segoe UI', Helvetica, Arial, sans-serif">
  <title>MiniOps architecture</title>
  <desc>Browser, frontend and API gateway in front of four FastAPI microservices, each with its own PostgreSQL database; Prometheus, Loki, Alloy and Grafana for observability; GitHub Actions publishing images to GHCR.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#637381"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#00A76F"/>
    </marker>
    <style>
      .bg { fill: #FFFFFF; }
      .box { fill: #FFFFFF; stroke: #DFE3E8; stroke-width: 1.5; }
      .svc { fill: #F2FBF7; stroke: #00A76F; stroke-width: 2; }
      .ext { fill: #FFFFFF; stroke: #919EAB; stroke-width: 1.5; stroke-dasharray: 6 4; }
      .band { fill: #F9FAFB; stroke: #DFE3E8; stroke-width: 1.5; }
      .db { fill: #EAF2FF; stroke: #1877F2; stroke-width: 1.5; }
      .title { font-size: 15px; font-weight: 700; fill: #1C252E; }
      .sub { font-size: 12px; fill: #637381; }
      .band-label { font-size: 12px; font-weight: 700; fill: #637381; letter-spacing: 1.2px; }
      .edge { stroke: #637381; stroke-width: 1.6; fill: none; }
      .flow { stroke: #00A76F; stroke-width: 2.2; fill: none; }
      .dashed { stroke-dasharray: 5 4; }
      .label { font-size: 11.5px; fill: #454F5B; }
      .flow-label { font-size: 11.5px; font-weight: 600; fill: #007867; }
      .num { font-size: 11px; font-weight: 700; fill: #FFFFFF; }
    </style>
  </defs>

  <rect class="bg" width="1280" height="880"/>

  <!-- ===== Row 1: edge ===== -->
  <rect class="ext" x="30" y="30" width="200" height="80" rx="12"/>
  <text class="title" x="130" y="64" text-anchor="middle">Monitored apps</text>
  <text class="sub" x="130" y="84" text-anchor="middle">your HTTP services · demo-app</text>

  <rect class="box" x="420" y="30" width="140" height="80" rx="12"/>
  <text class="title" x="490" y="64" text-anchor="middle">Browser</text>
  <text class="sub" x="490" y="84" text-anchor="middle">operator</text>

  <rect class="box" x="620" y="30" width="200" height="80" rx="12"/>
  <text class="title" x="720" y="64" text-anchor="middle">Frontend</text>
  <text class="sub" x="720" y="84" text-anchor="middle">React dashboard · :3000</text>

  <rect class="box" x="880" y="30" width="200" height="80" rx="12"/>
  <text class="title" x="980" y="64" text-anchor="middle">API Gateway</text>
  <text class="sub" x="980" y="84" text-anchor="middle">nginx · :8080</text>

  <line class="edge" x1="560" y1="70" x2="616" y2="70" marker-end="url(#arrow)"/>
  <line class="edge" x1="820" y1="70" x2="876" y2="70" marker-end="url(#arrow)"/>
  <text class="label" x="850" y="62" text-anchor="middle">/api</text>

  <!-- gateway fan-out bus -->
  <path class="edge" d="M980,110 V160 H125"/>
  <line class="edge" x1="125" y1="160" x2="125" y2="196" marker-end="url(#arrow)"/>
  <line class="edge" x1="385" y1="160" x2="385" y2="196" marker-end="url(#arrow)"/>
  <line class="edge" x1="645" y1="160" x2="645" y2="196" marker-end="url(#arrow)"/>
  <line class="edge" x1="905" y1="160" x2="905" y2="196" marker-end="url(#arrow)"/>
  <text class="label" x="992" y="142">REST  /api/v1/*</text>

  <!-- monitoring -> monitored apps -->
  <path class="flow" d="M320,200 V70 H234" marker-end="url(#arrow-green)"/>
  <rect x="244" y="118" width="70" height="20" rx="4" fill="#FFFFFF"/>
  <text class="flow-label" x="279" y="132" text-anchor="middle">HTTP GET</text>

  <!-- ===== Row 2: services ===== -->
  <rect class="svc" x="30" y="200" width="190" height="100" rx="14"/>
  <text class="title" x="125" y="236" text-anchor="middle">Target Service</text>
  <text class="sub" x="125" y="256" text-anchor="middle">register · validate URLs</text>
  <text class="sub" x="125" y="274" text-anchor="middle">SSRF protection</text>

  <rect class="svc" x="290" y="200" width="190" height="100" rx="14"/>
  <text class="title" x="385" y="236" text-anchor="middle">Monitoring Service</text>
  <text class="sub" x="385" y="256" text-anchor="middle">scheduler · health checks</text>
  <text class="sub" x="385" y="274" text-anchor="middle">failure threshold</text>

  <rect class="svc" x="550" y="200" width="190" height="100" rx="14"/>
  <text class="title" x="645" y="236" text-anchor="middle">Incident Service</text>
  <text class="sub" x="645" y="256" text-anchor="middle">open · acknowledge</text>
  <text class="sub" x="645" y="274" text-anchor="middle">resolve · timeline</text>

  <rect class="svc" x="810" y="200" width="190" height="100" rx="14"/>
  <text class="title" x="905" y="236" text-anchor="middle">Notification Service</text>
  <text class="sub" x="905" y="256" text-anchor="middle">store · deduplicate</text>
  <text class="sub" x="905" y="274" text-anchor="middle">forward to Telegram</text>

  <rect class="ext" x="1070" y="215" width="180" height="70" rx="12"/>
  <text class="title" x="1160" y="245" text-anchor="middle">Telegram</text>
  <text class="sub" x="1160" y="265" text-anchor="middle">optional · Bot API</text>

  <!-- service-to-service calls, numbered in workflow order -->
  <line class="flow" x1="290" y1="250" x2="224" y2="250" marker-end="url(#arrow-green)"/>
  <text class="flow-label" x="255" y="242" text-anchor="middle">targets</text>
  <text class="flow-label" x="255" y="268" text-anchor="middle">status</text>
  <line class="flow" x1="480" y1="250" x2="546" y2="250" marker-end="url(#arrow-green)"/>
  <text class="flow-label" x="513" y="242" text-anchor="middle">open</text>
  <text class="flow-label" x="513" y="268" text-anchor="middle">resolve</text>
  <line class="flow" x1="740" y1="250" x2="806" y2="250" marker-end="url(#arrow-green)"/>
  <text class="flow-label" x="773" y="242" text-anchor="middle">notify</text>
  <line class="flow dashed" x1="1000" y1="250" x2="1066" y2="250" marker-end="url(#arrow-green)"/>
  <text class="flow-label" x="1033" y="242" text-anchor="middle">alert</text>

  <!-- ===== Row 3: data ===== -->
  <rect class="band" x="30" y="350" width="970" height="150" rx="14"/>
  <text class="band-label" x="515" y="488" text-anchor="middle">POSTGRESQL 16 · ONE DATABASE PER SERVICE, NO SHARED TABLES</text>
  <g>
    <line class="edge" x1="125" y1="300" x2="125" y2="392"/>
    <line class="edge" x1="385" y1="300" x2="385" y2="392"/>
    <line class="edge" x1="645" y1="300" x2="645" y2="392"/>
    <line class="edge" x1="905" y1="300" x2="905" y2="392"/>
  </g>
  <g class="cyl">
    <path class="db" d="M65,400 a60,10 0 0,0 120,0 v52 a60,10 0 0,1 -120,0 z"/>
    <ellipse class="db" cx="125" cy="400" rx="60" ry="10"/>
    <text class="sub" x="125" y="440" text-anchor="middle" font-weight="600" fill="#1C252E">target_db</text>

    <path class="db" d="M325,400 a60,10 0 0,0 120,0 v52 a60,10 0 0,1 -120,0 z"/>
    <ellipse class="db" cx="385" cy="400" rx="60" ry="10"/>
    <text class="sub" x="385" y="440" text-anchor="middle" font-weight="600" fill="#1C252E">monitoring_db</text>

    <path class="db" d="M585,400 a60,10 0 0,0 120,0 v52 a60,10 0 0,1 -120,0 z"/>
    <ellipse class="db" cx="645" cy="400" rx="60" ry="10"/>
    <text class="sub" x="645" y="440" text-anchor="middle" font-weight="600" fill="#1C252E">incident_db</text>

    <path class="db" d="M845,400 a60,10 0 0,0 120,0 v52 a60,10 0 0,1 -120,0 z"/>
    <ellipse class="db" cx="905" cy="400" rx="60" ry="10"/>
    <text class="sub" x="905" y="440" text-anchor="middle" font-weight="600" fill="#1C252E">notification_db</text>
  </g>

  <!-- legend -->
  <g transform="translate(1070,360)">
    <text class="band-label" x="0" y="14">LEGEND</text>
    <line class="flow" x1="0" y1="38" x2="36" y2="38" marker-end="url(#arrow-green)"/>
    <text class="label" x="46" y="42">service call (REST)</text>
    <line class="edge" x1="0" y1="64" x2="36" y2="64" marker-end="url(#arrow)"/>
    <text class="label" x="46" y="68">request / data</text>
    <rect class="ext" x="0" y="84" width="36" height="20" rx="4"/>
    <text class="label" x="46" y="98">outside MiniOps</text>
    <rect class="svc" x="0" y="114" width="36" height="20" rx="4"/>
    <text class="label" x="46" y="128">microservice</text>
  </g>

  <!-- ===== Row 4: observability ===== -->
  <rect class="band" x="30" y="530" width="1220" height="170" rx="14"/>
  <text class="band-label" x="50" y="554">OBSERVABILITY</text>

  <rect class="box" x="50" y="572" width="150" height="46" rx="10"/>
  <text class="title" x="125" y="600" text-anchor="middle" font-size="13">cAdvisor</text>
  <rect class="box" x="50" y="628" width="150" height="46" rx="10"/>
  <text class="title" x="125" y="656" text-anchor="middle" font-size="13">Node Exporter</text>

  <rect class="box" x="270" y="590" width="170" height="66" rx="12"/>
  <text class="title" x="355" y="618" text-anchor="middle">Prometheus</text>
  <text class="sub" x="355" y="638" text-anchor="middle">metrics · alert rules</text>

  <rect class="box" x="555" y="590" width="170" height="66" rx="12"/>
  <text class="title" x="640" y="618" text-anchor="middle">Grafana</text>
  <text class="sub" x="640" y="638" text-anchor="middle">dashboards · :3001</text>

  <rect class="box" x="840" y="590" width="150" height="66" rx="12"/>
  <text class="title" x="915" y="618" text-anchor="middle">Loki</text>
  <text class="sub" x="915" y="638" text-anchor="middle">log storage</text>

  <rect class="box" x="1060" y="590" width="170" height="66" rx="12"/>
  <text class="title" x="1145" y="618" text-anchor="middle">Grafana Alloy</text>
  <text class="sub" x="1145" y="638" text-anchor="middle">reads container logs</text>

  <line class="edge" x1="200" y1="595" x2="266" y2="612" marker-end="url(#arrow)"/>
  <line class="edge" x1="200" y1="651" x2="266" y2="634" marker-end="url(#arrow)"/>
  <line class="edge" x1="440" y1="623" x2="551" y2="623" marker-end="url(#arrow)"/>
  <line class="edge" x1="840" y1="623" x2="729" y2="623" marker-end="url(#arrow)"/>
  <line class="edge" x1="1060" y1="623" x2="994" y2="623" marker-end="url(#arrow)"/>
  <text class="label" x="355" y="684" text-anchor="middle">scrapes every service's /metrics/</text>
  <text class="label" x="1145" y="684" text-anchor="middle">JSON logs + correlation IDs</text>
  <text class="label" x="640" y="684" text-anchor="middle">Monitoring Service also queries Prometheus</text>

  <!-- ===== Row 5: CI/CD ===== -->
  <text class="band-label" x="50" y="748">CI/CD · GITHUB ACTIONS</text>
  <rect class="box" x="30" y="762" width="190" height="80" rx="12"/>
  <text class="title" x="125" y="796" text-anchor="middle">git push / PR</text>
  <text class="sub" x="125" y="816" text-anchor="middle">main · develop · v* tags</text>

  <rect class="box" x="290" y="762" width="190" height="80" rx="12"/>
  <text class="title" x="385" y="796" text-anchor="middle">Validate</text>
  <text class="sub" x="385" y="816" text-anchor="middle">ruff · compose config</text>

  <rect class="box" x="550" y="762" width="190" height="80" rx="12"/>
  <text class="title" x="645" y="796" text-anchor="middle">Test</text>
  <text class="sub" x="645" y="816" text-anchor="middle">unit · integration · build</text>

  <rect class="box" x="810" y="762" width="190" height="80" rx="12"/>
  <text class="title" x="905" y="796" text-anchor="middle">Publish to GHCR</text>
  <text class="sub" x="905" y="816" text-anchor="middle">5 images · latest · sha-…</text>

  <rect class="box" x="1070" y="762" width="180" height="80" rx="12"/>
  <text class="title" x="1160" y="796" text-anchor="middle">make deploy</text>
  <text class="sub" x="1160" y="816" text-anchor="middle">pull · restart · verify</text>

  <line class="edge" x1="220" y1="802" x2="286" y2="802" marker-end="url(#arrow)"/>
  <line class="edge" x1="480" y1="802" x2="546" y2="802" marker-end="url(#arrow)"/>
  <line class="edge" x1="740" y1="802" x2="806" y2="802" marker-end="url(#arrow)"/>
  <line class="edge" x1="1000" y1="802" x2="1066" y2="802" marker-end="url(#arrow)"/>
</svg>
